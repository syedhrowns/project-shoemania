name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-detect project root
        id: detect-root
        run: |
          if [ -f "package.json" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "Project root detected at repository root (.)"
          else
            PROJECT_DIR=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \; | head -n 1)
            if [ -n "$PROJECT_DIR" ]; then
              echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
              echo "Project root detected in subfolder: $PROJECT_DIR"
            else
              echo "dir=." >> "$GITHUB_OUTPUT"
              echo "Fallback to repository root (.)"
            fi
          fi

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ${{ steps.detect-root.outputs.dir }}
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Build production bundle
        working-directory: ${{ steps.detect-root.outputs.dir }}
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.detect-root.outputs.dir }}/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
