<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShoeMania</title>
    <script type="text/javascript">
      // Single Page App redirect for GitHub Pages hosting
      (function() {
        var l = window.location;
        var pathSegments = l.pathname.split('/').filter(Boolean);
        var isGitHubPages = l.hostname.indexOf('github.io') > -1;
        var pathSegmentsToKeep = (isGitHubPages && pathSegments.length > 0) ? 1 : 0;

        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body>
  </body>
</html>
